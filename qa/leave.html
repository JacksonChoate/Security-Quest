<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<base href="../">
<meta name="qa-sizes" content="1366x768,2048x1280,390x844">
<link rel="stylesheet" href="style.css">
<script>
window.QA=[];window.QAERR=[];window.QA_TIMER_LOOP=true;   // real game loop under virtual time
window.addEventListener('error',e=>QAERR.push('ERROR '+(e.message||e)+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+(e.error&&e.error.stack?' :: '+e.error.stack.split('\n').slice(1,4).map(s=>s.trim()).join(' | '):'')));
window.addEventListener('unhandledrejection',e=>QAERR.push('REJECT '+(e.reason&&e.reason.message||e.reason)));
const _ce=console.error;console.error=(...a)=>{QAERR.push('console.error '+a.map(x=>x&&x.stack?x.stack.split('\n').slice(0,3).join(' | '):String(x)).join(' '));_ce.apply(console,a)};
if(!/[?&]run=1/.test(location.search)){document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;inset:0 0 auto;z-index:99;margin:0;padding:12px 16px;background:#ff2e63;color:#000;font:15px sans-serif">Test page not started: it clears saved progress, so run it with qa/run-tests.ps1 (which uses a separate browser profile).</p>'));throw new Error('QA page opened directly; refusing to clear saved progress.');}
try{localStorage.clear();localStorage.setItem('secplus-quest-settings',JSON.stringify({music:.5,sfx:.7,muted:true,motion:true}))}catch(e){}
</script>
</head><body>
<div id="app"><header id="hud"></header><div id="gameWrap"><div id="game"></div></div><main id="panel" aria-live="polite"></main></div><div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js" crossorigin="anonymous"></script>
<script>setInterval(()=>{const b=document.querySelector(".unlockmodal [data-u=close]");if(b)b.click()},300)   // close unlock pop-ups like a player</script>
<script src="js/questions.js"></script><script src="js/objectives.js"></script>
<script src="js/explain/d1.js"></script><script src="js/explain/d2.js"></script><script src="js/explain/d3.js"></script><script src="js/explain/d4.js"></script><script src="js/explain/d5.js"></script><script src="js/explain/d6.js"></script>
<script src="js/pbq.js"></script><script src="js/sims.js"></script>
<script src="js/state.js"></script><script src="js/audio.js"></script><script src="js/themes.js"></script><script src="js/ui.js"></script><script src="js/fx.js"></script><script src="js/bosses.js"></script><script src="js/minions.js"></script>
<script src="js/scenes/boot.js"></script><script src="js/scenes/world.js"></script><script src="js/scenes/battle.js"></script><script src="js/scenes/packet.js"></script>
<script src="js/modes.js"></script><script src="js/exam.js"></script><script src="js/meta.js"></script><script src="js/plan.js"></script><script src="js/campaign.js"></script><script src="js/unlocks.js"></script><script src="js/main.js"></script>
<script>
const log=(...a)=>QA.push(a.join(' '));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const P=()=>document.getElementById('panel');
const vis=el=>el&&!el.disabled&&!el.hidden&&el.offsetParent!==null;
const st=k=>{const s=App.game.scene.getScene(k);return s?s.sys.settings.status:'none'};   // 5 = RUNNING, 8 = SHUTDOWN
async function answerSome(n){
  for(let i=0,done=0;i<60&&done<n;i++){
    const p=P(),c=[...p.querySelectorAll('#sCont,#contBtn')].find(vis);
    if(c){c.click();await wait(120);continue}
    const o=[...p.querySelectorAll('.opt')].find(vis);if(o){o.click();done++;await wait(150);continue}
    await wait(200);
  }
}
// Leave exactly like a player: the "< cd ~/map" button, then "Leave" in the confirm dialog if one appears.
async function leave(){
  const b=document.querySelector('#hud button');b&&b.click();await wait(80);
  const y=document.querySelector('.modal [data-a=yes]');if(y)y.click();
  await wait(700);
}
async function lit(){return Promise.race([wait(2000).then(()=>'snapTimeout'),new Promise(res=>{try{App.game.renderer.snapshot(img=>{const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=0;i<d.length;i+=64)if(d[i]+d[i+1]+d[i+2]>60)n++;res(n)})}catch(e){res('snapErr '+e.message)}})])}
async function check(tag,extra){
  for(let i=0;i<40&&(Unlocks.open||Unlocks.queue.length);i++)await wait(250);   // a queued unlock pop-up legitimately pauses the map
  await wait(300);const px=await lit();
  const errs=QAERR.splice(0);
  const w=App.game.scene.getScene('World'),ok=App.mode==='world'&&st('World')===5&&w.children&&w.children.list.length>20&&!document.getElementById('gameWrap').hidden;
  const others=['Battle','Packet'].filter(k=>st(k)===5);
  log(`${ok&&!errs.length&&!others.length?'PASS':'FAIL'} ${tag}: mode=${App.mode} World=${st('World')} objs=${w.children?w.children.list.length:0} canvas=${App.game.scale.width}x${App.game.scale.height} otherRunning=[${others}] litPixels=${px} ${extra||''}`);if(typeof px==='number'&&px<50)log('   BLACK CANVAS after '+tag);
  errs.forEach(e=>log('   '+e));
}
async function run(){
  for(let i=0;i<60&&!App.mode;i++)await wait(250);
  if(App.mode==='handle'){await wait(400);const inp=document.getElementById('hsInput');inp.value='qa_tester';document.getElementById('hsForm').requestSubmit();await wait(600)}
  if(UI._modal)UI._modal();await wait(400);
  log('renderer='+(App.game.renderer.type===2?'WebGL':'Canvas'));
  await check('boot');

  // 1. The reported bug: Story Campaign chapter, answer a couple, back out.
  App.go('story');await wait(200);Story.start(0);await wait(300);await answerSome(0);   // click through briefing
  await wait(500);await answerSome(3);
  const attBefore=Object.keys(S.att).length;
  await leave();
  const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
  await check('story mid-battle',`answered=${attBefore} savedAtt=${Object.keys(saved.att||{}).length} storyProg=${JSON.stringify(saved.story&&saved.story.prog||null)}`);

  // 2. Story: leave during the briefing chat, the decision, and the incident task.
  App.go('story');await wait(200);Story.start(0);await wait(300);await leave();await check('story briefing');
  // 3. Zone battle mid-fight (and during the intro text)
  App.go('battle',2);await wait(150);await leave();await check('zone battle during intro');
  App.go('battle',2);await wait(600);await answerSome(2);await leave();await check('zone battle mid-fight');
  // 4. Boss PBQ special / weak spots / daily / rematch
  App.go('weak');await wait(600);await answerSome(2);await leave();await check('weak spots');
  Meta.startDaily();await wait(600);await answerSome(1);await leave();await check('daily');
  // 5. Pause menu -> quit to map
  App.go('battle',1);await wait(700);Meta.pause();await wait(100);document.querySelector('.pausebox [data-a=quit]').click();await wait(700);await check('pause > quit');
  // 6. Pause, then leave with the top-bar button while paused
  App.go('battle',1);await wait(700);Meta.pause();await wait(100);UI._modal&&UI._modal();await leave();await check('pause > resume > leave');
  // 7. Packet Defender mid-game
  App.go('packet');await wait(500);const pk=App.scene('Packet');pk&&pk.start();await wait(1500);await leave();await check('packet mid-game');
  // 8. HTML modes mid-way
  App.go('blitz','acr');await wait(400);await leave();await check('blitz');
  App.go('exam');await wait(200);Modes.examStart('quick');await wait(600);Modes.exAns(0);await leave();await check('quick quiz');
  App.go('lab');await wait(300);await leave();await check('pbq lab');
  App.go('flash','all');await wait(200);Modes.flashAnswer(0);await leave();await check('flashcards');
  for(const m of ['heat','codex','profile','plan','story'])  {App.go(m);await wait(250);await leave();await check(m)}
  App.go('handle',{change:true});await wait(400);await leave();await check('handle change');
  // 9. Battle -> another battle -> map (back-to-back starts)
  App.go('battle',1);await wait(50);App.go('battle',3);await wait(600);await leave();await check('battle then battle');
  // 10. Story chapter reached the decision, then leave; then resume shows progress
  S.story.ch=Math.max(S.story.ch,1);App.go('story');await wait(200);Story.start(0);await wait(300);await answerSome(0);await wait(400);await answerSome(5);await leave();
  await check('story after a foe',`prog=${JSON.stringify(S.story.prog||null)}`);
  const saved2=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');log('saved to disk: prog='+JSON.stringify(saved2.story&&saved2.story.prog));
  App.go('story');await wait(200);const rb=P().querySelector('[data-resume]');log('hub shows resume: '+!!rb+' chip='+(P().querySelector('.chip.prog')||{}).textContent);
  if(rb){rb.click();await wait(900);const sc=App.scene('Battle');log('resumed: running='+!!sc+' ei='+(sc&&sc.B.ei)+' right='+(sc&&sc.B.right)+' panel='+P().innerText.slice(0,90).replace(/\s+/g,' '));
    await answerSome(2);await leave();await check('leave after resume');}
  // pause -> resume -> leave again, many times quickly (the reported black-map path)
  for(let k=0;k<5;k++){App.go('battle',1+k%5);await wait(500);Meta.pause();await wait(60);UI._modal&&UI._modal();await wait(30);await leave();await check('pause/resume/leave #'+(k+1))}
  // leave via Esc pause menu "Quit to map" from a story chapter
  Story.start(0);await wait(300);await answerSome(0);await wait(400);await answerSome(1);Meta.pause();await wait(60);document.querySelector('.pausebox [data-a=quit]').click();await wait(700);await check('story pause > quit');
  App.game&&App.game.loop.stop();document.body.insertAdjacentHTML('beforeend',`<pre id="qaout">${(QAERR.concat(['---'],QA)).join('\n').replace(/</g,'&lt;')}</pre>`);
}
if(/[?&]run=1/.test(location.search))window.addEventListener('load',()=>setTimeout(()=>run().catch(e=>{QA.push('HARNESS '+e.message+' '+e.stack);App.game&&App.game.loop.stop();document.body.insertAdjacentHTML('beforeend',`<pre id="qaout">${(QAERR.concat(['---'],QA)).join('\n').replace(/</g,'&lt;')}</pre>`)}),500));
</script>
</body></html>
